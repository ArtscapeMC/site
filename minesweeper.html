<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="face.png" sizes="32x32" type="image/png">
    <title>Наговнокодил сапёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --accent: #e94560;
            --accent-hover: #ff6b85;
            --text-primary: #eee;
            --text-secondary: #aaa;
            --cell-closed: #4a5568;
            --cell-open: #e2e8f0;
            --cell-hover: #5a6578;
            --border: #2d3748;
        }

        body.theme-light {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0;
            --accent: #3182ce;
            --accent-hover: #4299e1;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --cell-closed: #cbd5e0;
            --cell-open: #f7fafc;
            --cell-hover: #a0aec0;
            --border: #e2e8f0;
        }

        body.theme-nature {
            --bg-primary: #1b5e20;
            --bg-secondary: #2e7d32;
            --bg-tertiary: #388e3c;
            --accent: #ffc107;
            --accent-hover: #ffd54f;
            --text-primary: #ffffff;
            --text-secondary: #c8e6c9;
            --cell-closed: #66bb6a;
            --cell-open: #e8f5e9;
            --cell-hover: #81c784;
            --border: #4caf50;
        }

        body.theme-ocean {
            --bg-primary: #01579b;
            --bg-secondary: #0277bd;
            --bg-tertiary: #0288d1;
            --accent: #ff6f00;
            --accent-hover: #ff8f00;
            --text-primary: #e1f5fe;
            --text-secondary: #b3e5fc;
            --cell-closed: #4fc3f7;
            --cell-open: #e1f5fe;
            --cell-hover: #29b6f6;
            --border: #03a9f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-tertiary));
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .watermark {
            position: fixed;
            top: 30px;
            right: 30px;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-secondary);
            opacity: 0.5;
            transform: rotate(-10deg);
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 10;
            pointer-events: none;
            animation: watermarkFloat 4s ease-in-out infinite;
        }

        @keyframes watermarkFloat {
            0%, 100% { transform: rotate(-10deg) translateY(0); }
            50% { transform: rotate(-10deg) translateY(-5px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
            50% { text-shadow: 0 0 20px var(--accent), 2px 2px 4px rgba(0,0,0,0.3); }
        }

        .controls {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .difficulty-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent);
        }

        .custom-settings {
            display: none;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .custom-settings.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        input[type="number"] {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            width: 120px;
        }

        .settings-row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-primary);
            padding: 15px;
            border-radius: 8px;
        }

        .settings-group h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .skin-options, .theme-options, .effects-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .skin-btn, .theme-btn, .effect-btn {
            padding: 8px 16px;
            font-size: 14px;
            background: var(--bg-tertiary);
            min-width: 80px;
        }

        .skin-btn.active, .theme-btn.active, .effect-btn.active {
            background: var(--accent);
        }

        .timer {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            text-align: center;
        }

        .info-item .label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .info-item .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }

        .game-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            overflow-x: auto;
            padding: 10px;
        }

        .game-board {
            display: inline-grid;
            gap: 2px;
            background: var(--border);
            padding: 6px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .cell {
            width: 38px;
            height: 38px;
            background: var(--cell-closed);
            border: 2px solid var(--border);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cell:hover {
            background: var(--cell-hover);
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .cell.revealed {
            background: var(--cell-open);
            border-color: var(--border);
            cursor: default;
            animation: revealCell 0.3s ease;
        }

        @keyframes revealCell {
            0% { 
                transform: scale(0.8) rotateY(180deg); 
                opacity: 0; 
            }
            50% { 
                transform: scale(1.1) rotateY(90deg); 
            }
            100% { 
                transform: scale(1) rotateY(0); 
                opacity: 1; 
            }
        }

        .cell.revealed:hover {
            transform: scale(1);
            box-shadow: none;
        }

        .cell.flagged {
            background: var(--accent);
            animation: placeFlag 0.4s ease;
        }

        @keyframes placeFlag {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.3) rotate(-15deg); }
            50% { transform: scale(1.2) rotate(15deg); }
            75% { transform: scale(1.1) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .cell.mine {
            background: #e53e3e;
            animation: explode 0.5s ease;
        }

        @keyframes explode {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); background: #ff0000; }
            100% { transform: scale(1); }
        }

        .cell.mine-hit {
            background: #c53030;
            animation: bigExplode 0.8s ease;
        }

        @keyframes bigExplode {
            0% { transform: scale(1); }
            25% { transform: scale(1.8); background: #ff0000; box-shadow: 0 0 30px #ff0000; }
            50% { transform: scale(1.5) rotate(180deg); }
            100% { transform: scale(1); }
        }

        .cell.num-1 { color: #3182ce; }
        .cell.num-2 { color: #38a169; }
        .cell.num-3 { color: #e53e3e; }
        .cell.num-4 { color: #805ad5; }
        .cell.num-5 { color: #d69e2e; }
        .cell.num-6 { color: #00b5d8; }
        .cell.num-7 { color: #000; }
        .cell.num-8 { color: #718096; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: modalSlide 0.5s ease;
        }

        @keyframes modalSlide {
            from { transform: translateY(-100px) scale(0.8); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-content h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .modal-content.win h2 {
            color: #48bb78;
            animation: winPulse 1s ease infinite;
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .modal-content.lose h2 {
            color: #e53e3e;
        }

        .effects-low .cell {
            transition: none;
            animation: none !important;
        }

        .effects-low .cell:hover {
            transform: none;
        }

        .effects-low h1 {
            animation: none;
        }

        .effects-off * {
            transition: none !important;
            animation: none !important;
        }

        .effects-off .cell:hover {
            transform: none !important;
        }

        .hint {
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Стили для разных скинов */
        body.skin-emoji .cell.flagged::after {
            content: "🚩";
            font-size: 20px;
        }

        body.skin-emoji .cell.mine::after {
            content: "💣";
            font-size: 20px;
        }

        body.skin-classic .cell.flagged::after {
            content: "⚑";
            font-size: 24px;
            color: white;
        }

        body.skin-classic .cell.mine::after {
            content: "✱";
            font-size: 24px;
            color: white;
        }

        body.skin-modern .cell.flagged::after {
            content: "▲";
            font-size: 18px;
            color: white;
        }

        body.skin-modern .cell.mine::after {
            content: "●";
            font-size: 24px;
            color: white;
        }

        @media (max-width: 768px) {
            .watermark {
                font-size: 18px;
                top: 15px;
                right: 15px;
            }

            h1 {
                font-size: 2em;
            }

            .cell {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            button {
                padding: 10px 16px;
                font-size: 14px;
            }

            body.skin-emoji .cell.flagged::after,
            body.skin-emoji .cell.mine::after {
                font-size: 16px;
            }

            body.skin-classic .cell.flagged::after,
            body.skin-classic .cell.mine::after,
            body.skin-modern .cell.mine::after {
                font-size: 18px;
            }

            body.skin-modern .cell.flagged::after {
                font-size: 14px;
            }
        }

        .instructions {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .instructions p {
            margin: 5px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body class="skin-emoji">
    <div class="watermark">by Artscape</div>
    
    <div class="container">
        <header>
            <h1>💣 » Minesweeper « 💣</h1>
        </header>

        <div class="controls">
            <div class="difficulty-buttons">
                <button onclick="setDifficulty('easy')" class="diff-btn active" id="easy-btn">
                    Easy (15×15, 25 мин)
                </button>
                <button onclick="setDifficulty('normal')" class="diff-btn" id="normal-btn">
                    Normal (21×21, 60 мин)
                </button>
                <button onclick="setDifficulty('hard')" class="diff-btn" id="hard-btn">
                    Hard (28×28, 150 мин)
                </button>
                <button onclick="toggleCustom()" class="diff-btn" id="custom-btn">
                    Customize
                </button>
            </div>

            <div class="custom-settings" id="customSettings">
                <div class="input-group">
                    <label>Ширина</label>
                    <input type="number" id="customWidth" min="5" max="50" value="15">
                </div>
                <div class="input-group">
                    <label>Высота</label>
                    <input type="number" id="customHeight" min="5" max="50" value="15">
                </div>
                <div class="input-group">
                    <label>Мины</label>
                    <input type="number" id="customMines" min="1" max="500" value="25">
                </div>
                <button onclick="applyCustom()">Применить</button>
            </div>

            <div class="settings-row">
                <div class="settings-group">
                    <h3>Скин</h3>
                    <div class="skin-options">
                        <button class="skin-btn active" onclick="setSkin('emoji')">Эмодзи</button>
                        <button class="skin-btn" onclick="setSkin('classic')">Классика</button>
                        <button class="skin-btn" onclick="setSkin('modern')">Современный</button>
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Тема</h3>
                    <div class="theme-options">
                        <button class="theme-btn active" onclick="setTheme('dark')">Тёмная</button>
                        <button class="theme-btn" onclick="setTheme('light')">Светлая</button>
                        <button class="theme-btn" onclick="setTheme('nature')">Природа</button>
                        <button class="theme-btn" onclick="setTheme('ocean')">Океан</button>
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Эффекты</h3>
                    <div class="effects-options">
                        <button class="effect-btn active" onclick="setEffects('high')">Высокие</button>
                        <button class="effect-btn" onclick="setEffects('low')">Низкие</button>
                        <button class="effect-btn" onclick="setEffects('off')">Выкл</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="timer" id="timer">00:00:000</div>

        <div class="game-info">
            <div class="info-item">
                <div class="label">Мины</div>
                <div class="value" id="minesCount">25</div>
            </div>
            <div class="info-item">
                <div class="label">Флаги</div>
                <div class="value" id="flagsCount">0</div>
            </div>
            <div class="info-item">
                <div class="label">Осталось ячеек</div>
                <div class="value" id="cellsLeft">200</div>
            </div>
        </div>

        <div class="game-container">
            <div class="game-board" id="gameBoard"></div>
        </div>

        <div class="instructions">
            <p><strong>Управление:</strong> ЛКМ - открыть ячейку | ПКМ - поставить флаг | Пробел - новая игра</p>
        </div>
    </div>

    <div class="modal" id="gameModal">
        <div class="modal-content" id="modalContent">
            <h2 id="modalTitle"></h2>
            <p id="modalMessage"></p>
            <p id="modalTime"></p>
            <button onclick="restartGame()" style="margin-top: 20px;">Новая игра</button>
        </div>
    </div>

    <script>
        let gameState = {
            width: 15,
            height: 15,
            mines: 25,
            board: [],
            revealed: [],
            flagged: [],
            gameOver: false,
            gameWon: false,
            firstClick: true,
            startTime: null,
            timerInterval: null,
            difficulty: 'easy'
        };

        function initGame() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${gameState.width}, 38px)`;
            
            gameState.board = [];
            gameState.revealed = [];
            gameState.flagged = [];
            gameState.gameOver = false;
            gameState.gameWon = false;
            gameState.firstClick = true;
            gameState.startTime = null;
            
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }
            document.getElementById('timer').textContent = '00:00:000';

            // Создаём пустое поле
            for (let y = 0; y < gameState.height; y++) {
                gameState.board[y] = [];
                gameState.revealed[y] = [];
                gameState.flagged[y] = [];
                for (let x = 0; x < gameState.width; x++) {
                    gameState.board[y][x] = 0;
                    gameState.revealed[y][x] = false;
                    gameState.flagged[y][x] = false;
                    
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    cell.addEventListener('click', handleCellClick);
                    cell.addEventListener('contextmenu', handleRightClick);
                    
                    board.appendChild(cell);
                }
            }

            updateInfo();
        }

        function placeMines(excludeX, excludeY) {
            let minesPlaced = 0;
            
            // Создаём безопасную зону 3x3 вокруг первого клика
            const safeZone = [];
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const nx = excludeX + dx;
                    const ny = excludeY + dy;
                    if (nx >= 0 && nx < gameState.width && ny >= 0 && ny < gameState.height) {
                        safeZone.push(`${nx},${ny}`);
                    }
                }
            }
            
            while (minesPlaced < gameState.mines) {
                const x = Math.floor(Math.random() * gameState.width);
                const y = Math.floor(Math.random() * gameState.height);
                
                // Не ставим мину в безопасной зоне
                if (gameState.board[y][x] !== -1 && !safeZone.includes(`${x},${y}`)) {
                    gameState.board[y][x] = -1;
                    minesPlaced++;
                }
            }

            // Подсчитываем числа
            for (let y = 0; y < gameState.height; y++) {
                for (let x = 0; x < gameState.width; x++) {
                    if (gameState.board[y][x] !== -1) {
                        gameState.board[y][x] = countAdjacentMines(x, y);
                    }
                }
            }
        }

        function countAdjacentMines(x, y) {
            let count = 0;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < gameState.width && ny >= 0 && ny < gameState.height) {
                        if (gameState.board[ny][nx] === -1) count++;
                    }
                }
            }
            return count;
        }

        function handleCellClick(e) {
            if (gameState.gameOver) return;
            
            const x = parseInt(e.target.dataset.x);
            const y = parseInt(e.target.dataset.y);

            if (gameState.flagged[y][x]) return;

            if (gameState.firstClick) {
                gameState.firstClick = false;
                placeMines(x, y);
                startTimer();
                
                // Открываем начальную область
                revealCell(x, y);
                
                // Если кликнули по пустой ячейке, откроется область автоматически
                // Если нет, попробуем открыть соседние пустые ячейки
                if (gameState.board[y][x] !== 0) {
                    // Ищем ближайшую пустую ячейку в радиусе 2
                    for (let dy = -2; dy <= 2; dy++) {
                        for (let dx = -2; dx <= 2; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            if (nx >= 0 && nx < gameState.width && 
                                ny >= 0 && ny < gameState.height && 
                                gameState.board[ny][nx] === 0) {
                                revealCell(nx, ny);
                                return;
                            }
                        }
                    }
                }
            } else {
                revealCell(x, y);
            }
        }

        function handleRightClick(e) {
            e.preventDefault();
            if (gameState.gameOver) return;

            const x = parseInt(e.target.dataset.x);
            const y = parseInt(e.target.dataset.y);

            if (gameState.revealed[y][x]) return;

            gameState.flagged[y][x] = !gameState.flagged[y][x];
            
            if (gameState.flagged[y][x]) {
                e.target.classList.add('flagged');
            } else {
                e.target.classList.remove('flagged');
            }

            updateInfo();
        }

        function revealCell(x, y) {
            if (x < 0 || x >= gameState.width || y < 0 || y >= gameState.height) return;
            if (gameState.revealed[y][x]) return;

            gameState.revealed[y][x] = true;
            const cell = document.querySelector(`[data-x="${x}"][data-y="${y}"]`);
            cell.classList.add('revealed');
            cell.classList.remove('flagged');

            if (gameState.board[y][x] === -1) {
                cell.classList.add('mine-hit');
                gameOver(false);
                return;
            }

            const num = gameState.board[y][x];
            if (num > 0) {
                cell.textContent = num;
                cell.classList.add(`num-${num}`);
            } else {
                // Открываем соседние ячейки
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        revealCell(x + dx, y + dy);
                    }
                }
            }

            updateInfo();
            checkWin();
        }

        function checkWin() {
            let revealedCount = 0;
            for (let y = 0; y < gameState.height; y++) {
                for (let x = 0; x < gameState.width; x++) {
                    if (gameState.revealed[y][x]) revealedCount++;
                }
            }

            const totalCells = gameState.width * gameState.height;
            if (revealedCount === totalCells - gameState.mines) {
                gameOver(true);
            }
        }

        function gameOver(won) {
            gameState.gameOver = true;
            gameState.gameWon = won;
            clearInterval(gameState.timerInterval);

            if (!won) {
                // Показываем все мины с задержкой для эффекта
                let mineRevealDelay = 0;
                for (let y = 0; y < gameState.height; y++) {
                    for (let x = 0; x < gameState.width; x++) {
                        if (gameState.board[y][x] === -1) {
                            const cell = document.querySelector(`[data-x="${x}"][data-y="${y}"]`);
                            setTimeout(() => {
                                cell.classList.add('mine');
                            }, mineRevealDelay);
                            mineRevealDelay += 20; // Эффект последовательного взрыва
                        }
                    }
                }
            }

            setTimeout(() => showModal(won), won ? 500 : 1000);
        }

        function showModal(won) {
            const modal = document.getElementById('gameModal');
            const content = document.getElementById('modalContent');
            const title = document.getElementById('modalTitle');
            const message = document.getElementById('modalMessage');
            const time = document.getElementById('modalTime');

            if (won) {
                content.className = 'modal-content win';
                title.textContent = '🎉 ПОБЕДА! 🎉';
                message.textContent = 'Поздравляем! Вы очистили всё поле!';
            } else {
                content.className = 'modal-content lose';
                title.textContent = '💥 ВЗРЫВ! 💥';
                message.textContent = 'Вы наступили на мину!';
            }

            time.textContent = `Время: ${document.getElementById('timer').textContent}`;
            modal.classList.add('active');
        }

        function startTimer() {
            gameState.startTime = Date.now();
            gameState.timerInterval = setInterval(() => {
                const elapsed = Date.now() - gameState.startTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                const milliseconds = elapsed % 1000;
                
                document.getElementById('timer').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(milliseconds).padStart(3, '0')}`;
            }, 10);
        }

        function updateInfo() {
            let flagCount = 0;
            let revealedCount = 0;

            for (let y = 0; y < gameState.height; y++) {
                for (let x = 0; x < gameState.width; x++) {
                    if (gameState.flagged[y][x]) flagCount++;
                    if (gameState.revealed[y][x]) revealedCount++;
                }
            }

            const totalCells = gameState.width * gameState.height;
            document.getElementById('minesCount').textContent = gameState.mines;
            document.getElementById('flagsCount').textContent = flagCount;
            document.getElementById('cellsLeft').textContent = totalCells - gameState.mines - revealedCount;
        }

        function setDifficulty(level) {
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            
            if (level === 'easy') {
                gameState.width = 15;
                gameState.height = 15;
                gameState.mines = 25;
                document.getElementById('easy-btn').classList.add('active');
            } else if (level === 'normal') {
                gameState.width = 21;
                gameState.height = 21;
                gameState.mines = 60; // Изменено с 45 на 60
                document.getElementById('normal-btn').classList.add('active');
            } else if (level === 'hard') {
                gameState.width = 28; // Изменено с 40 на 28
                gameState.height = 28; // Изменено с 40 на 28
                gameState.mines = 150;
                document.getElementById('hard-btn').classList.add('active');
            }

            gameState.difficulty = level;
            document.getElementById('customSettings').classList.remove('active');
            initGame();
        }

        function toggleCustom() {
            const customSettings = document.getElementById('customSettings');
            customSettings.classList.toggle('active');
            
            if (customSettings.classList.contains('active')) {
                document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('custom-btn').classList.add('active');
            }
        }

        function applyCustom() {
            const width = parseInt(document.getElementById('customWidth').value);
            const height = parseInt(document.getElementById('customHeight').value);
            const mines = parseInt(document.getElementById('customMines').value);

            const maxMines = (width * height) - 10;
            if (mines > maxMines) {
                alert(`Слишком много мин! Максимум: ${maxMines}`);
                return;
            }

            gameState.width = width;
            gameState.height = height;
            gameState.mines = mines;
            gameState.difficulty = 'custom';

            initGame();
        }

        function restartGame() {
            document.getElementById('gameModal').classList.remove('active');
            initGame();
        }

        function setSkin(skin) {
            document.querySelectorAll('.skin-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.body.className = document.body.className.split(' ')
                .filter(c => !c.startsWith('skin-')).join(' ');
            document.body.classList.add(`skin-${skin}`);
        }

        function setTheme(theme) {
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.body.className = document.body.className.split(' ')
                .filter(c => !c.startsWith('theme-')).join(' ');
            
            if (theme !== 'dark') {
                document.body.classList.add(`theme-${theme}`);
            }
            
            // Сохраняем скин
            const skinClass = Array.from(document.body.classList).find(c => c.startsWith('skin-'));
            if (skinClass) {
                document.body.classList.add(skinClass);
            }
            
            // Сохраняем эффекты
            const effectsClass = Array.from(document.body.classList).find(c => c.startsWith('effects-'));
            if (effectsClass) {
                document.body.classList.add(effectsClass);
            }
        }

        function setEffects(level) {
            document.querySelectorAll('.effect-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.body.className = document.body.className.split(' ')
                .filter(c => !c.startsWith('effects-')).join(' ');
            
            if (level !== 'high') {
                document.body.classList.add(`effects-${level}`);
            }

            // Сохраняем другие классы
            const skinClass = Array.from(document.body.classList).find(c => c.startsWith('skin-'));
            if (skinClass) {
                document.body.classList.add(skinClass);
            }
            const themeClass = Array.from(document.body.classList).find(c => c.startsWith('theme-'));
            if (themeClass) {
                document.body.classList.add(themeClass);
            }
        }

        // Обработка нажатия пробела
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                restartGame();
            }
        });

        // Инициализация игры при загрузке
        initGame();
    </script>
</body>
</html>
